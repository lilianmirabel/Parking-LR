services:
  postgres:
    image: postgres:16.11
    container_name: parking-postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: parkinglr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d parkinglr"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: eclipse-temurin:25-jdk
    container_name: parking-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parkinglr
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: postgres_pass
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    working_dir: /app
    command: sh -c "./mvnw spring-boot:run"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parking-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

  nextjs:
    image: node:22-alpine
    container_name: parking-nextjs
    depends_on:
      - app
    working_dir: /app
    volumes:
      - ./frontend:/app
      - nextjs_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
  nextjs_node_modules:
  maven_cache:
