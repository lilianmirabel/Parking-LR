services:
  postgres:
    image: postgres:16.11
    container_name: parking-postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: parkinglr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: amazoncorretto:25-jdk
    container_name: parking-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parkinglr
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: postgres_pass
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    working_dir: /app
    command: tail -f /dev/null
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parking-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  postgres_data: